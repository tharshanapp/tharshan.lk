# ============================================
# OpenGov AI Assistant - Docker Compose
# Production-ready container orchestration
# ============================================

version: '3.8'

services:
  # Main Application Service
  opengov-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opengov-ai-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key_here}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change_this_secure_token_123}
      - APP_ENV=${APP_ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000,https://tharshan.lk}
      - CHUNK_SIZE=${CHUNK_SIZE:-1000}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-200}
    volumes:
      # Persist vector database
      - vector_db_data:/app/backend/vector_db
      # Persist uploaded PDFs
      - pdf_data:/app/backend/data
      # Mount .env file (optional)
      - ./backend/.env:/app/backend/.env:ro
    networks:
      - opengov-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy (Optional - for production)
  # Note: This service handles both HTTP (port 80) and HTTPS (port 443)
  # If SSL certificates are missing, HTTP will still work on port 80
  nginx:
    image: nginx:alpine
    container_name: opengov-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - opengov-ai
    networks:
      - opengov-network
    profiles:
      - production

# Named Volumes
volumes:
  vector_db_data:
    driver: local
    name: opengov_vector_db
  pdf_data:
    driver: local
    name: opengov_pdf_data
  nginx_cache:
    driver: local
    name: opengov_nginx_cache

# Network
networks:
  opengov-network:
    driver: bridge
    name: opengov-network