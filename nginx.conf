# ============================================
# OpenGov AI Assistant - Nginx Configuration
# Production reverse proxy with SSL
# ============================================

events {
    worker_connections 1024;
}

http {
    # Upstream configuration
    upstream opengov_backend {
        server opengov-ai:8000;
        keepalive 32;
    }

    # Map for WebSocket support (if needed in future)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTTP Server - Serves content directly (no redirect to HTTPS)
    # This ensures the app works even without SSL certificates
    server {
        listen 80;
        server_name tharshan.lk www.tharshan.lk;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Main location - proxy to backend
        location / {
            proxy_pass http://opengov_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
            
            # General rate limiting
            limit_req zone=general_limit burst=20 nodelay;
        }

        # API endpoints with stricter rate limiting
        location /ask {
            proxy_pass http://opengov_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Longer timeout for AI responses
            proxy_read_timeout 120s;
            
            # API rate limiting
            limit_req zone=api_limit burst=10 nodelay;
        }

        # Admin endpoints
        location /admin/ {
            proxy_pass http://opengov_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # File upload size limit
            client_max_body_size 50M;
        }

        # Static files caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
            proxy_pass http://opengov_backend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://opengov_backend;
            access_log off;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }
    }

    # HTTPS Server - Production with SSL (optional, only starts if SSL certs exist)
    server {
        listen 443 ssl http2;
        server_name tharshan.lk www.tharshan.lk;

        # SSL configuration - Use self-signed certs for testing, real certs for production
        ssl_certificate /etc/nginx/ssl/certificate.crt;
        ssl_certificate_key /etc/nginx/ssl/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling (comment out if using self-signed certs)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # Cache settings
        proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=app_cache:10m max_size=100m inactive=60m use_temp_path=off;

        # Main location
        location / {
            proxy_pass http://opengov_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # General rate limiting
            limit_req zone=general_limit burst=20 nodelay;
        }

        # API endpoints with stricter rate limiting
        location /ask {
            proxy_pass http://opengov_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Longer timeout for AI responses
            proxy_read_timeout 120s;
            
            # API rate limiting
            limit_req zone=api_limit burst=10 nodelay;
        }

        # Admin endpoints
        location /admin/ {
            proxy_pass http://opengov_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # File upload size limit
            client_max_body_size 50M;
        }

        # Static files caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
            proxy_pass http://opengov_backend;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://opengov_backend;
            access_log off;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }
    }
}